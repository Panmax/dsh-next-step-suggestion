<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none">
  <defs>
    <linearGradient id="nss_bg" x1="0" y1="0" x2="640" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F7FC" />
      <stop offset="1" stop-color="#ECEFF8" />
    </linearGradient>
    <linearGradient id="nss_pill" x1="296" y1="130" x2="344" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8FF9" />
      <stop offset="1" stop-color="#3964FE" />
    </linearGradient>
  </defs>

  <!-- Outer canvas -->
  <rect width="640" height="300" rx="16" fill="url(#nss_bg)" />

  <!-- LEFT PANEL: Before Tab (Ghost Preview) -->
  <g transform="translate(28, 30)">
    <!-- Assistant completed reply bubble -->
    <rect x="0" y="0" width="256" height="68" rx="12" fill="#FFFFFF" stroke="#DCE2EE" stroke-width="1.2" />
    <circle cx="20" cy="20" r="8" fill="#E6F6EC" />
    <path d="M16.5 20.2L19 22.7L24 17.5" stroke="#239B56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="36" y="16" width="168" height="8" rx="4" fill="#3B465C" />
    <rect x="36" y="32" width="196" height="7" rx="3.5" fill="#8C97AC" />
    <rect x="36" y="46" width="142" height="7" rx="3.5" fill="#A6B0C3" />

    <!-- Composer Card (Empty draft + Ghost preview) -->
    <rect x="0" y="84" width="256" height="156" rx="16" fill="#FFFFFF" stroke="#C9D3E4" stroke-width="1.5" />
    <!-- Leading caret at start -->
    <rect x="16" y="102" width="2" height="18" rx="1" fill="#3964FE" />
    <!-- Ghost suggestion bars (gray caption tone) -->
    <rect x="23" y="106" width="84" height="9" rx="4.5" fill="#ADB4C2" />
    <rect x="112" y="106" width="66" height="9" rx="4.5" fill="#BCC3D0" />
    <!-- Tab keycap hint badge -->
    <rect x="188" y="100" width="44" height="21" rx="5" fill="#F2F5FA" stroke="#D2DAE8" stroke-width="1.2" />
    <path d="M198 110.5H214M214 110.5L209.8 106.5M214 110.5L209.8 114.5" stroke="#6E7B91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M219.5 106V115" stroke="#6E7B91" stroke-width="1.6" stroke-linecap="round" />

    <!-- Composer bottom toolbar -->
    <circle cx="24" cy="214" r="12" fill="#F0F3F9" />
    <path d="M24 209V219M19 214H29" stroke="#525E75" stroke-width="1.6" stroke-linecap="round" />
    <rect x="46" y="207" width="44" height="14" rx="7" fill="#F0F3F9" />
    <rect x="98" y="207" width="52" height="14" rx="7" fill="#F0F3F9" />
    <!-- Disabled send button (draft is still empty!) -->
    <circle cx="230" cy="214" r="14" fill="#3964FE" fill-opacity="0.35" />
    <path d="M230 220V208M230 208L225.5 212.5M230 208L234.5 212.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CENTER TRANSITION: Press Tab -->
  <g transform="translate(296, 128)">
    <rect x="0" y="0" width="48" height="44" rx="12" fill="url(#nss_pill)" />
    <path d="M12 22H30M30 22L24.5 16.5M30 22L24.5 27.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35.5 16V28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- RIGHT PANEL: After Tab (Editable Draft, Not Sent Yet) -->
  <g transform="translate(356, 30)">
    <!-- Assistant completed reply bubble (unchanged: no auto-sent message!) -->
    <rect x="0" y="0" width="256" height="68" rx="12" fill="#FFFFFF" stroke="#DCE2EE" stroke-width="1.2" />
    <circle cx="20" cy="20" r="8" fill="#E6F6EC" />
    <path d="M16.5 20.2L19 22.7L24 17.5" stroke="#239B56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="36" y="16" width="168" height="8" rx="4" fill="#3B465C" />
    <rect x="36" y="32" width="196" height="7" rx="3.5" fill="#8C97AC" />
    <rect x="36" y="46" width="142" height="7" rx="3.5" fill="#A6B0C3" />

    <!-- Composer Card (Accepted primary-ink draft + trailing caret + ready Send) -->
    <rect x="0" y="84" width="256" height="156" rx="16" fill="#FFFFFF" stroke="#5B8FF9" stroke-width="1.8" />
    <!-- Accepted editable draft bars (primary ink tone) -->
    <rect x="16" y="106" width="84" height="9" rx="4.5" fill="#1F293D" />
    <rect x="105" y="106" width="66" height="9" rx="4.5" fill="#1F293D" />
    <!-- Caret moved to the end of accepted text -->
    <rect x="176" y="102" width="2.2" height="18" rx="1.1" fill="#3964FE" />

    <!-- Composer bottom toolbar -->
    <circle cx="24" cy="214" r="12" fill="#F0F3F9" />
    <path d="M24 209V219M19 214H29" stroke="#525E75" stroke-width="1.6" stroke-linecap="round" />
    <rect x="46" y="207" width="44" height="14" rx="7" fill="#F0F3F9" />
    <rect x="98" y="207" width="52" height="14" rx="7" fill="#F0F3F9" />
    <!-- Active bright blue send button ready for explicit user submit -->
    <circle cx="230" cy="214" r="14" fill="#3964FE" />
    <path d="M230 220V208M230 208L225.5 212.5M230 208L234.5 212.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
